<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS PRO - Monitor en Vivo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #141414; color: #fff; }

    #zonaSuperior { display: flex; height: 68vh; }
    #map { flex: 1; z-index: 1; }
    #panelDerecho { width: 45%; background: #000; padding: 18px; }

    #estado { font-weight: bold; letter-spacing: 1px; }
    .ok { color: #00ff6a; }
    .sin { color: #ff4d4d; }

    #infoExtra { margin-top: 14px; font-size: 14px; color: #bbb; line-height: 1.8; }

    #tarjetas { display: flex; gap: 14px; justify-content: space-around; padding: 16px; background: #1b1b1b; }
    .tarjeta { background: #242424; border-radius: 8px; padding: 14px 26px; text-align: center; min-width: 160px; }
    .tarjeta .titulo { font-size: 12px; color: #ccc; letter-spacing: 1px; }
    .tarjeta .valor { margin-top: 6px; font-size: 20px; font-weight: bold; color: #2196f3; }

    #barraInferior { height: 60px; background: #0d0d0d; }
  </style>
</head>
<body>

  <div id="zonaSuperior">
    <div id="map"></div>
    <div id="panelDerecho">
      <span id="estado" class="sin">● SIN DATOS</span>
      <div id="infoExtra">
        Dispositivo: <span id="txtDispositivo">-</span><br>
        Precisión: <span id="txtPrecision">-</span> m<br>
        Última señal: <span id="txtFecha">-</span>
      </div>
    </div>
  </div>

  <div id="tarjetas">
    <div class="tarjeta"><div class="titulo">LATITUD</div><div class="valor" id="txtLat">-</div></div>
    <div class="tarjeta"><div class="titulo">LONGITUD</div><div class="valor" id="txtLng">-</div></div>
    <div class="tarjeta"><div class="titulo">VELOCIDAD</div><div class="valor" id="txtVel">- km/h</div></div>
    <div class="tarjeta"><div class="titulo">ALTITUD</div><div class="valor" id="txtAlt">- m</div></div>
  </div>

  <div id="barraInferior"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const URL_FIREBASE = "https://gpspro-54204-default-rtdb.firebaseio.com/location.json";

    const map = L.map('map').setView([6.2442, -75.5812], 15); // se recentra al recibir datos
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marcador = null, circulo = null, recorrido = null;
    const puntos = [];
    let ultimoTimestamp = null;

    function fijar(id, texto) { document.getElementById(id).textContent = texto; }

    async function actualizar() {
      try {
        const resp = await fetch(URL_FIREBASE, { cache: "no-store" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const d = await resp.json();

        const lat = parseFloat(d?.lat ?? d?.latitude);
        const lng = parseFloat(d?.lng ?? d?.lon ?? d?.longitude);
        if (isNaN(lat) || isNaN(lng)) throw new Error("sin coordenadas");

        // Marcador del dispositivo (uno solo, se mueve)
        if (!marcador) {
          marcador = L.marker([lat, lng]).addTo(map).bindPopup("Dispositivo GPS PRO").openPopup();
        } else {
          marcador.setLatLng([lat, lng]);
        }

        // Círculo de precisión
        const prec = parseFloat(d?.precision ?? d?.accuracy ?? 0);
        if (prec > 0) {
          if (!circulo) circulo = L.circle([lat, lng], { radius: prec, color: '#2196f3', fillOpacity: 0.1 }).addTo(map);
          else circulo.setLatLng([lat, lng]).setRadius(prec);
        }

        // Recorrido: agrega punto solo si es una lectura nueva
        const ts = d?.timestamp ?? null;
        if (ts !== ultimoTimestamp) {
          ultimoTimestamp = ts;
          puntos.push([lat, lng]);
          if (!recorrido) recorrido = L.polyline(puntos, { color: '#00ff6a', weight: 3 }).addTo(map);
          else recorrido.setLatLngs(puntos);
        }

        map.setView([lat, lng], Math.max(map.getZoom(), 16));

        // Paneles de datos
        fijar('txtLat', lat.toFixed(6));
        fijar('txtLng', lng.toFixed(6));
        fijar('txtVel', (parseFloat(d?.velocidad ?? d?.speed ?? 0) * 3.6).toFixed(1) + " km/h");
        fijar('txtAlt', parseFloat(d?.altitud ?? d?.altitude ?? 0).toFixed(0) + " m");
        fijar('txtDispositivo', d?.dispositivo ?? '-');
        fijar('txtPrecision', prec > 0 ? prec.toFixed(0) : '-');
        fijar('txtFecha', d?.fecha ? new Date(d.fecha).toLocaleString() : '-');

        // Indicador EN DIRECTO (señal de menos de 90 segundos)
        const edad = d?.timestamp ? Date.now() - d.timestamp : Infinity;
        const estado = document.getElementById('estado');
        if (edad < 90000) { estado.textContent = "● EN DIRECTO"; estado.className = "ok"; }
        else { estado.textContent = "● SIN SEÑAL RECIENTE"; estado.className = "sin"; }

      } catch (e) {
        const estado = document.getElementById('estado');
        estado.textContent = "● SIN DATOS / ERROR";
        estado.className = "sin";
        console.error(e);
      }
    }

    actualizar();
    setInterval(actualizar, 5000); // consulta Firebase cada 5 segundos
  </script>
</body>
</html>
